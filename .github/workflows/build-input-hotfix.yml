name: Condemned2 Windows x64 Input State V3 Loader-Safe (0.6.0)
on:
  push:
    branches:
      - fix/input-weapon-pickup-qte-060
    paths:
      - 'src/condemned2_input.cpp'
      - 'src/condemned2_input.h'
      - 'ci/patch_win64_input_release.py'
      - 'ci/patch_input_state_v2.py'
      - 'ci/patch_input_state_v3.py'
      - 'ci/smoke_windows_pe_loader.py'
      - '.github/workflows/build-input-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-win64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout input fix branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate input source changes
        shell: pwsh
        run: |
          $cpp = Get-Content -Raw src/condemned2_input.cpp
          $header = Get-Content -Raw src/condemned2_input.h
          if (-not $cpp.Contains('REX_IMPORT(Input_KeyUp, ReleaseBind')) { throw 'Missing Input_KeyUp import' }
          if (-not $cpp.Contains('void Condemned2InputDriver::FlushNativeKeys()')) { throw 'Missing guest key flushing logic' }
          if (-not $header.Contains('std::vector<int32_t> requestedNativeKeys')) { throw 'Missing guest key state' }
          Write-Host 'Source patch checks passed'

      - name: Download original compiled release (no game assets)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/psxrestore/Condemned2Recomp/releases/download/0.6.0/condemned2recompV0.6.0_windows.zip'
          & curl.exe --fail --location --retry 3 --silent --show-error --output official.zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Download of official public release failed' }
          $expected = 'd013f0d3cae6d02898a93e2ba3bb0f75c66e67fbbc3347750ae201036b3ac296'
          $actual = (Get-FileHash official.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected official ZIP SHA256: $actual" }
          Write-Host "Official release verified: $actual"

      - name: Patch and package existing Windows executable — V3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci/patch_input_state_v3.py --input official.zip --output Condemned2Recomp-0.6.0-InputState-V3-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'PE hotfix packaging failed' }

      - name: Verify PE32+ can be launched by Windows loader
        shell: pwsh
        run: |
          python ci/smoke_windows_pe_loader.py --archive Condemned2Recomp-0.6.0-InputState-V3-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'The Windows loader rejected the EXE' }

      - name: Upload standalone release archive
        uses: actions/upload-artifact@v4
        with:
          name: Condemned2Recomp-0.6.0-InputState-V3-Windows-x64
          path: Condemned2Recomp-0.6.0-InputState-V3-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
