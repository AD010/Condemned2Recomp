# Real source recompilation on public Windows runner; proprietary inputs and
# generated executable are read from / published ONLY to a PRIVATE repo.
# Required fine-grained PAT secret in this PUBLIC source repository:
# CONDEMNED2_CI_INPUTS_TOKEN = Contents: Read and write on the ONE private
# repository AD010/Condemned2-CI-Inputs (needed to fetch ZIP & upload Release).
name: Condemned 2 TRUE Windows x64 Recomp (private inputs and output)
# Only the user explicitly authorizes starting Actions; source commits must
# never launch builds, upload artifacts, or incur runner work automatically.
on:
  workflow_dispatch:
  # Explicit user authorization: one build from fully synced upstream files.
  push:
    branches:
      - fix/input-weapon-pickup-qte-060
    paths:
      - '.github/workflows/build-input-hotfix.yml'

permissions:
  contents: read

jobs:
  probe-win64:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check actual Windows x64 runner and compiler versions
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          cmake --version
          clang++ --version
          git --version
          gh --version

  build-win64:
    needs: probe-win64
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirm private read/write token is configured
        env:
          INPUT_TOKEN: ${{ secrets.CONDEMNED2_CI_INPUTS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INPUT_TOKEN)) {
            throw 'Missing CONDEMNED2_CI_INPUTS_TOKEN secret in PUBLIC source repo Settings > Secrets and variables > Actions. Add fine-grained PAT for AD010/Condemned2-CI-Inputs, Contents: Read and write.'
          }
          Write-Host 'Private repo token is configured (not displayed).'

      - name: Checkout fixed PUBLIC sources and ReXGlue SDK submodules
        uses: actions/checkout@v4
        with:
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Checkout PRIVATE XEX/XEXP input ZIP (keep out of public repo)
        uses: actions/checkout@v4
        with:
          repository: AD010/Condemned2-CI-Inputs
          ref: main
          path: private-inputs
          token: ${{ secrets.CONDEMNED2_CI_INPUTS_TOKEN }}
          persist-credentials: false

      - name: Initialize MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Validate complete PowerShell build script syntax
        run: |
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'src/ci/build_true_win64_release.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($buildScript, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell build script contains syntax errors'
          }
          Write-Host 'PowerShell script parse verification passed.'

      - name: REAL recompilation from XEX with Clang and ReXGlue codegen
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src'
          $inputZip = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/Condemned2_Private_CI_Inputs.zip'
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          & (Join-Path $source 'ci/build_true_win64_release.ps1') -SourceRoot $source -InputZip $inputZip -OutputDir $out
          if ($LASTEXITCODE -ne 0) { throw 'True source recompilation failed' }

      - name: Windows loader smoke test (no game logic)
        run: |
          python src/ci/smoke_windows_pe_loader.py --archive release-output/Condemned2Recomp-RealSource-InputFix-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows loader rejected compiled executable' }

      - name: Upload compiled ZIP ONLY to PRIVATE GitHub Release
        env:
          GH_TOKEN: ${{ secrets.CONDEMNED2_CI_INPUTS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "condemned2-sourcefix-$env:GITHUB_SHA".Substring(0,30)
          $zip = Join-Path $env:GITHUB_WORKSPACE 'release-output/Condemned2Recomp-RealSource-InputFix-Windows-x64.zip'
          $privateRepo = 'AD010/Condemned2-CI-Inputs'
          if (!(Test-Path $zip)) { throw 'Source-compiled ZIP missing' }
          $name = 'Condemned2Recomp Windows x64 source input fix'
          $notes = 'Experimental true ReXGlue source recompilation of user-owned XEX/XEXP. The ZIP excludes game assets. Native keyboard/mouse Use/Grab/QTE changes have NOT yet been validated in gameplay. Do not distribute this private test build.'
          gh release create $tag $zip --repo $privateRepo --target main --title $name --notes $notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Private Release upload failed' }
          Write-Host 'PRIVATE RELEASE UPLOADED (source-compiled EXE not exposed in public Actions Artifacts).'
          gh release view $tag --repo $privateRepo --json url,assets
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify private Release' }
